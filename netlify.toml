[build]
  publish = "/"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The whole app is one index.html, so caching it means a deploy is invisible to
# anyone who has already opened the site — they keep running the old build with
# no way to tell. That is how a fixed bug can keep being reported: the fix
# shipped, the browser never fetched it.
#
# The page is small and everything expensive it loads is inline, so revalidating
# it on every visit costs little and removes an entire class of confusion.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Browser-enforced hardening. These apply to the page itself, which is where
# an attack would actually land — the API already sets its own headers, but a
# stolen session is taken from the browser, not from the server.
[[headers]]
  for = "/*"
  [headers.values]
    # No other site may frame this. Without it, a page can be loaded invisibly
    # inside an attacker's frame and a user tricked into clicking controls that
    # switch real hardware.
    X-Frame-Options = "DENY"
    # Mapbox is allowed explicitly rather than by loosening the policy: the
    # console's base map is Mapbox GL, which needs its script, its stylesheet,
    # its tile/style API, and a blob: worker for tile decoding. Without these
    # named, the map silently fails to load even once a token is configured —
    # the CSP blocks it and nothing says why.
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://api.mapbox.com;
      style-src 'self' 'unsafe-inline' https://api.mapbox.com;
      worker-src 'self' blob:;
      child-src 'self' blob:;
      img-src 'self' data: blob: https://api.mapbox.com;
      font-src 'self' data:;
      connect-src 'self' https://kroven-console-production.up.railway.app https://api.weather.gov https://api.mapbox.com https://events.mapbox.com;
      frame-ancestors 'none';
      form-action 'self';
      base-uri 'self';
      object-src 'none';
      upgrade-insecure-requests
    """
    # Once seen, never speak to this host over plain HTTP again — including the
    # first request of a later visit, which is the one a network attacker wants.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    # The URL can carry a household id; do not hand it to third-party sites.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The app needs none of these, so nothing embedded in it may ask.
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()"

# 'unsafe-inline' for scripts is not an oversight: the console is a prebuilt
# bundle of inline scripts that cannot be rewritten to use nonces without
# rebuilding the frontend from source. The rest of the policy still does real
# work — frame-ancestors, object-src, base-uri and form-action all close
# avenues that do not depend on inline script being blocked. Worth revisiting
# whenever the frontend is rebuilt.
